<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>girl in red | Home</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar md:navbar-expand bg-1">
    <div class="container">
        <a class="navbar-brand" href="index.html">girl in red</a>

        <button class="btn-icon navbar-toggler" type="button"
            data-bs-toggle="drawer" data-bs-target="#menu"
            aria-controls="menu" aria-expanded="false"
            aria-label="Open menu">
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>

        <dialog class="drawer drawer-end" id="menu"
            tabindex="-1" aria-labelledby="menu-title">
            <div class="drawer-header">
                <p class="drawer-title" id="menu-title">Menu</p>
                <button class="btn-close" type="button"
                    data-bs-dismiss="drawer" aria-label="Close menu"></button>
            </div>

            <div class="drawer-body">
                <ul class="nav navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html"
                            aria-current="page">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#songs">Songs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>
                </ul>
            </div>
        </dialog>
    </div>
</nav>

    <main class="container py-4">
    <h1>girl in red</h1>
    <p>Explore three albums and six of my favourite songs.</p>

    <div class="row">
        <div class="col-12 md:col-6 mx-auto">
            <div class="carousel slide" id="album-carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="images/BLUE.jpg" class="d-block w-100"
                            alt="Blue wax seal on the blue album cover">
                    </div>

                    <div class="carousel-item">
                        <img src="images/I'M DOING IT AGAIN BABY!.jpg"
                            class="d-block w-100"
                            alt="I'M DOING IT AGAIN BABY! album cover with large lettering">
                    </div>

                    <div class="carousel-item">
                        <img src="images/if i could make it go quiet.jpg"
                            class="d-block w-100"
                            alt="Painted figure in red on the if i could make it go quiet album cover">
                    </div>
                </div>

                <div class="mt-3">
                    <button class="btn-solid theme-primary" type="button"
                        data-bs-target="#album-carousel" data-bs-slide="prev">
                        Previous
                    </button>

                    <button class="btn-solid theme-primary" type="button"
                        data-bs-target="#album-carousel" data-bs-slide="next">
                        Next
                    </button>
                </div>
            </div>
        </div>
    </div>

    <section class="mt-5" id="songs">
        <h2>More songs to explore</h2>
    </section>
</main>

    <footer class="container py-4 mt-5">
        <p>Created by Yushu (Lucia) Li for CCT360.</p>
    </footer>

    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
